<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Garent - Dashboard</title>
  <link rel="stylesheet" href="css/admin.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header class="dash-header">
      <nav class="dash-nav">
        <a href="index.html" class="logo" style="font-size:32px; font-weight:900; color:#000; text-decoration:none;">GARENT</a>
        <ul>
          <li><a href="dashboard.html" class="active">Dashboard</a></li>
          <li><a href="transaction/transaction.html">Transaction</a></li>
          <li><a href="category/category.html">Category</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <div class="stats-grid">
        <div class="stat-card">
          <h4>Sewa Aktif</h4>
          <p>1 Unit (PS5)</p>
        </div>
        <div class="stat-card">
          <h4>Total Transaksi</h4>
          <p>2 Transaksi Selesai</p>
        </div>
        <div class="stat-card">
          <h4>Status Pembayaran</h4>
          <p>Lunas</p>
        </div>
      </div>

      <div class="table-container">
        <table class="table-data">
          <thead>
            <tr>
              <th>No</th>
              <th>Unit Konsol</th>
              <th>Tanggal Sewa</th>
              <th>Durasi</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>1</td>
              <td>PlayStation 5</td>
              <td>2026-10-01</td>
              <td>2 Hari</td>
              <td>Aktif</td>
            </tr>
            <tr>
              <td>2</td>
              <td>PlayStation 5</td>
              <td>2026-10-04</td>
              <td>3 Hari</td>
              <td>Aktif</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>
</body>
</html>
