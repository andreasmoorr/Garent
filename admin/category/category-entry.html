<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Garent - Entry Category</title>
  <link rel="stylesheet" href="../../css/admin.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header class="dash-header">
      <nav class="dash-nav">
        <a href="../../index.html" class="logo" style="font-size:32px; font-weight:900; color:#000; text-decoration:none;">GARENT</a>
        <ul>
          <li><a href="../dashboard.html">Dashboard</a></li>
          <li><a href="../transaction/transaction.html">Transaction</a></li>
          <li><a href="category.html" class="active">Category</a></li>
        </ul>
      </nav>
    </header>

    <main style="margin-top: 30px;">
      <h2>Tambah Data Kategori</h2>
      <div class="form-card">
        <form action="category.html">
          <div class="form-group">
            <label for="nama">Nama Kategori Unit</label>
            <input type="text" id="nama" placeholder="Contoh: Xbox Series X" required>
          </div>
          <div class="form-group">
            <label for="harga">Harga Sewa Per Hari</label>
            <input type="text" id="harga" placeholder="Contoh: 120000" required>
          </div>
          <button type="submit" class="btn-action">Simpan Data</button>
        </form>
      </div>
    </main>
  </div>
</body>
</html>
